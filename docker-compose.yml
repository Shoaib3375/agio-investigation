# Python Investigation Service — own compose stack.
# Does NOT touch Laravel's docker-compose. Brings up its own Postgres and the
# FastAPI service, and joins Laravel's external network for RabbitMQ/app
# reachability when Laravel is running.

services:
  investigation-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agio_investigation
      POSTGRES_USER: investigation
      POSTGRES_PASSWORD: local_password
    ports:
      - "5437:5432"
    volumes:
      - investigation_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investigation -d agio_investigation"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  investigation-api:
    build: .
    depends_on:
      investigation-database:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Environment takes precedence over env_file. The host is the compose
      # service name (internal default network), reachable from the api.
      INVESTIGATION_DATABASE_URL: postgresql+asyncpg://investigation:local_password@investigation-database:5432/agio_investigation
      APP_ENV: local
      RABBITMQ_URL: amqp://agio:agio_secret@rabbitmq:5672/agio
    ports:
      - "8001:8000"
    networks:
      - default
      - paymentexchange

networks:
  # Bridge network for the api and its own database.
  # Not marked internal so the host can reach investigation-database on 5437
  # (needed for host-based pytest / alembic runs).
  default: {}
  # Laravel's external bridge so investigation-api can reach `rabbitmq` and
  # `app`. Must exist before `docker compose up` of investigation-api.
  paymentexchange:
    name: paymentexchange_payment-exchange
    external: true

volumes:
  investigation_db_data:
