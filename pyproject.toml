[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agio-investigation"
version = "0.1.0"
description = "AGIO Intelligent Transaction Investigation service"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi~=0.162.5",
    "uvicorn[standard]~=0.54.0",
    "pydantic~=2.14.3",
    "pydantic-settings~=2.16.2",
    "sqlalchemy[asyncio]~=2.1.8",
    "asyncpg~=0.32.0",
    "alembic~=1.20.1",
    "aio-pika~=10.2.3",
    "httpx~=0.28.1",
    "structlog~=26.1.0",
]

[project.optional-dependencies]
# Test client re-uses the runtime httpx dependency.
dev = [
    "pytest~=9.2.0",
    "pytest-asyncio~=1.4.1",
    "httpx~=0.28.1",
    "ruff~=0.17.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
